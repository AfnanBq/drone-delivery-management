services:
  db:
    image: postgis/postgis:16-3.4
    container_name: postgis_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata: